<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
  <!--
    VS Code activity-bar icon. Must be monochrome with no baked-in colour and no
    background fill — VS Code recolours it for the active/inactive/hover states.
    Same geometry as logo-mark.svg, rescaled from the 32 grid onto a 24 grid.
  -->
  <rect x="1.5" y="1.5" width="6.75" height="6.75" />
  <rect x="3" y="8.25" width="3.75" height="6" />
  <rect x="3" y="10.5" width="18" height="3.75" />
  <rect x="17.25" y="10.5" width="3.75" height="6" />
  <rect x="15.75" y="15.75" width="6.75" height="6.75" />
</svg>
