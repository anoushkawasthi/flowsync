<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!--
    Social card, rastered to frontend/src/app/opengraph-image.png. Uses the
    light theme deliberately: link previews sit on other people's surfaces,
    where the paper canvas reads as intentional and a dark card reads as a
    rendering failure.
  -->
  <defs>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#16161A" stroke-opacity="0.055" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#FAF7F0" />
  <rect width="1200" height="630" fill="url(#grid)" />

  <!-- logo tile + wordmark -->
  <g transform="translate(80 76)">
    <rect x="6" y="6" width="72" height="72" rx="14" fill="#16161A" />
    <rect x="0" y="0" width="72" height="72" rx="14" fill="#FF5C39" stroke="#16161A" stroke-width="4" />
    <g fill="#16161A" transform="translate(14.4 14.4) scale(1.35)">
      <rect x="2" y="2" width="9" height="9" />
      <rect x="4" y="11" width="5" height="8" />
      <rect x="4" y="14" width="24" height="5" />
      <rect x="23" y="14" width="5" height="8" />
      <rect x="21" y="21" width="9" height="9" />
    </g>
    <text x="94" y="50" font-family="Archivo" font-weight="800" font-size="42"
          letter-spacing="-1.3" fill="#16161A">FlowSync</text>
  </g>

  <!-- headline; the accent is spent on a highlighter bar, never a fill -->
  <rect x="80" y="356" width="606" height="30" fill="#FF5C39" />
  <text font-family="Archivo" font-weight="800" font-size="86" letter-spacing="-3.4" fill="#16161A">
    <tspan x="80" y="290">Persistent memory for</tspan>
    <tspan x="80" y="382">AI coding agents</tspan>
  </text>

  <text x="80" y="452" font-family="Archivo" font-weight="400" font-size="27"
        letter-spacing="-0.3" fill="#16161A" fill-opacity="0.72">
    Your agent logs decisions after every task and searches project
  </text>
  <text x="80" y="490" font-family="Archivo" font-weight="400" font-size="27"
        letter-spacing="-0.3" fill="#16161A" fill-opacity="0.72">
    history before starting new work — via MCP tools.
  </text>

  <!-- footer rule + micro-label -->
  <rect x="80" y="546" width="1040" height="2" fill="#16161A" opacity="0.18" />
  <text x="80" y="586" font-family="Archivo" font-weight="800" font-size="17"
        letter-spacing="2.4" fill="#16161A" fill-opacity="0.56">MODEL CONTEXT PROTOCOL</text>

  <!-- hard frame -->
  <rect x="4" y="4" width="1192" height="622" fill="none" stroke="#16161A" stroke-width="8" />
</svg>
